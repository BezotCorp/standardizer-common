[package]
name = "standardizer-common"
version = "1.0.1"
edition = "2024"
description = "Shared routing types for the Standardizer tools"
license = "Apache-2.0"
repository = "https://github.com/BezotCorp/standardizer-common"
readme = "README.md"

[features]
default = []
source = ["dep:serde"]
encode = ["dep:bincode-next"]
decode = ["dep:bincode-next"]

[dependencies]
bincode-next = { version = "3", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
