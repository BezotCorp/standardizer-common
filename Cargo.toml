[package]
name = "standardizer-common"
version = "2.3.0"
edition = "2024"
description = "Shared routing types for the Standardizer tools"
license = "Apache-2.0"
repository = "https://github.com/BezotCorp/standardizer-common"
readme = "README.md"

[features]
default = []
source = ["dep:ron", "dep:serde"]
encode = ["dep:bincode-next"]
decode = ["dep:bincode-next"]

[dependencies]
bincode-next = { version = "=3.2.0", optional = true }
ron = { version = "=0.12.3", optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
